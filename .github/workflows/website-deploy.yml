---
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true
      - name: install dependencies
        run: |
          sudo apt-get install \
            yui-compressor \
            rsync
      - name: sync Fastlane Play Store text and phone screenshots from XCSoar/XCSoar
        run: ruby scripts/sync_google_play_metadata.rb
      - name: build website
        run: bundle exec jekyll build --future
      - name: rsync deployments
        uses: burnett01/rsync-deployments@155b6d6c1219ab2224c20c58d423a3f1b850395f # v9
        with:
          switches: -rv --delete
          path: _site/
          remote_path: /var/wwwusers/www.xcsoar.org/public_html/
          remote_host: www.xcsoar.org
          remote_user: website
          remote_key: ${{ secrets.DEPLOY_KEY }}
        if: github.ref == 'refs/heads/master'
